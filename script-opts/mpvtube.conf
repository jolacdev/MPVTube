# Optional skin settings: copy to <MPV config>/script-opts/mpvtube.conf.
# Restart MPV after editing. Values below are defaults; omitted options keep defaults.
# For toggles, yes enables and no disables. MPV's osc option belongs in mpv.conf.

# Overall UI size (0.5–3); MPV's display DPI is applied automatically.
scale=1
# UI font family. Copy the bundled fonts into MPV's fonts folder; system fonts also work.
font=Roboto
# Timeline/highlight color: six RGB hex digits, without #.
accent=ff0033
# Show the media title in fullscreen and the video-information button.
title=yes
# Maximum menu width in logical pixels (240–600); simple choices use narrower panels.
menu_width=380
# Menu background opacity (0.2–1).
menu_opacity=0.6

# Inactivity before hiding; control reveal duration in seconds. Hiding takes 40% of this.
# fade_duration=0 makes control visibility instant; other UI transitions retain reference timing.
hide_timeout=3
fade_duration=0.25
# Keep controls visible while playback is paused.
show_on_pause=yes
# Seconds of stable hover before showing a button's tooltip.
tooltip_delay=0.45
# Enable general shortcuts; input.conf takes precedence. Mouse/menu controls stay active.
keyboard=yes
# Enable single-click playback and hold-to-2x on the video. Double-click still toggles fullscreen.
video_click=yes
# Lift bottom subtitles above visible controls; restore their position when hidden.
raise_subtitles=yes

# Both modes resize the existing MPV window and exit fullscreen. Toggle again to restore it.
# Mini player is borderless, kept on top and placed near the bottom-right.
pip=yes
pip_width=480
# Theater is centered, bordered and not kept on top. Widths are target sizes in MPV pixels.
theater=yes
theater_width=1280

# auto prefers thumbfast, then FFmpeg for local files. Choices: auto, ffmpeg, thumbfast, no.
thumbnails=auto
# Executable name on PATH, or a full path without quotes.
ffmpeg_path=ffmpeg
# Displayed preview width in logical pixels (120–320).
thumbnail_width=200
# Seconds between sampled frames; larger values reuse more cached previews.
thumbnail_interval=2
# Initial preview coalescing delay in seconds; movement does not restart it. 0 starts immediately.
thumbnail_delay=0
# Maximum cached frames for the current file (1–256); files are removed on change/exit.
thumbnail_cache=64
