# Copy to <MPV config>/script-opts/mpvtube.conf, then restart MPV.
# These are defaults; omitted options keep defaults. Toggles use yes/no.
# Native playback settings, including osc=no, belong in mpv.conf.

# Appearance and panel size
# Logical pixels are scaled automatically for display DPI.
scale=1
# Bundled Roboto matches the UI; a system font family also works.
font=Roboto
# Six RGB hex digits, without #.
accent=ff0033
# Fullscreen media title and the top information button.
title=yes
# Maximum ordinary/shortcut-guide widths. The rebinding form caps its width at 620.
menu_width=480
shortcut_width=900
# Menu background opacity, from 0.2 to 1.
menu_opacity=0.6

# Visibility and mouse behavior
# no makes all skin transitions, tooltips and preview requests immediate.
# yes restores hover, icon, switch, feedback and visibility animations.
animations=yes
# Settings > Animations saves its override to <MPV config>/mpvtube-preferences.json.
# Empty uses that default path. Delete the preferences file to return to .conf defaults.
preferences_path=
# Inactivity timeout while playing, in seconds. Hover/focus/menus/drags keep controls open.
hide_timeout=0.7
# Reveal time when animations=yes. Hiding takes 40% of this; 0 disables bar fading only.
fade_duration=0.1
# Keep the controls visible while playback is paused.
show_on_pause=yes
# Stable hover time before a tooltip when animations=yes, in seconds.
tooltip_delay=0.15
# Video click plays/pauses; holding uses temporary 2x. Double-click uses fullscreen.
video_click=yes

# Keyboard ownership and saved shortcuts
# mpvtube owns the keyboard: unassigned keys do nothing, with no native fallback.
# compatible opts into input.conf/native bindings. exclusive is an alias of mpvtube.
shortcut_policy=mpvtube
# no disables general skin keys and releases native keys; mouse/menu navigation stays active.
keyboard=yes
# Empty uses <MPV config>/mpvtube-keys.json. F1 edits/saves this file automatically.
# A custom path must be inside an existing, writable folder.
keymap_path=

# Playback and synchronization
# Seek seconds: Shift+Arrow, Arrow, Ctrl+Arrow, Ctrl+Alt+Arrow.
seek_precise=3
seek_short=10
seek_medium=60
seek_long=300
# Percentage points per volume key/wheel step, from 0.1 to 100.
volume_step=5
# Software amplification ceiling, from 100 to 1000. Above 100% can clip.
volume_max=200
# Seconds per subtitle/audio synchronization step; 0.05 is 50 ms.
sync_step=0.05
# Lift ordinary bottom subtitles above visible controls; restore when hidden.
raise_subtitles=yes

# Mini player
# Resize the existing window, remove its border, pin it on top and place bottom-right.
# Toggle again to restore the previous window settings. Width is in logical pixels.
pip=yes
pip_width=480

# Previews and export helper
# Executable on PATH, or a full path without quotes. Missing FFmpeg disables its features.
ffmpeg_path=ffmpeg
# auto prefers thumbfast, then FFmpeg for local videos. Choices: auto, ffmpeg, thumbfast, no.
# no retains timeline timestamps without preview images.
thumbnails=auto
# Logical preview width, from 120 to 320.
thumbnail_width=200
# Seconds between cached sample frames. Larger intervals reuse more previews.
thumbnail_interval=2
# Initial coalescing delay, in seconds; 0 starts immediately. Motion does not restart it.
thumbnail_delay=0
# Maximum cached frames per file, from 1 to 256; cleaned on file change/exit.
thumbnail_cache=64
